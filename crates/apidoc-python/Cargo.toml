[package]
name = "lsdocs-apidoc-python"
description = "First-party plugin documenting Python APIs from their source code."
version = "0.1.0"
edition.workspace = true
# Above the workspace's: its parser needs it.
rust-version = "1.98"
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
lsdocs-apidoc.workspace = true
lsdocs-apidoc-plugin.workspace = true
lsdocs-plugin-sdk.workspace = true
ruff_python_ast.workspace = true
ruff_python_parser.workspace = true
ruff_text_size.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
lsdocs-parser-rst.workspace = true
lsdocs-parser-markdown.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
